.back{border:0;background:none;color:var(--tint);font:inherit;font-size:17px;padding:4px 0;margin-bottom:4px;cursor:pointer}
.mecard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);cursor:pointer;transition:transform .12s ease-out}
.mecard:active,.nextm:active,.lastm:active,.trn:active{transform:scale(.985)}
.mecard .av{width:56px;height:56px;font-size:19px}.mecard b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}.mecard .sp>span{color:var(--muted);font-size:14px}
.mst{display:flex;gap:14px;margin-top:6px;font-size:13px;color:var(--muted)}.mst b{display:inline!important;font-size:15px!important;color:var(--text)}
.due{display:block;margin-top:6px;font-size:13px;color:var(--amber);font-weight:600}.chev{font-size:24px;color:var(--muted);opacity:.6}
.nextm{margin-top:10px;border-radius:22px;padding:16px 16px 14px;color:#fff;background:linear-gradient(135deg,#123a8a,#0b1d4d);box-shadow:0 14px 34px -18px rgba(0,0,0,.6);cursor:pointer;transition:transform .12s ease-out,background .4s ease;position:relative;overflow:hidden}
.nextm .lab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:12px 0 6px}
.vs .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}.vs .tm span{font-size:13px;font-weight:600;line-height:1.2}
.vs .tm .tlogo{filter:drop-shadow(0 6px 12px rgba(0,0,0,.3))}
.vs .ctr{display:flex;flex-direction:column;align-items:center;gap:2px}.vs .when{font-size:20px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}.vs .hr{font-size:15px;opacity:.85;font-variant-numeric:tabular-nums}
.nextm .meta{display:flex;flex-direction:column;gap:3px;font-size:14px;opacity:.92;margin-top:6px}
.nextm .foot{display:flex;align-items:center;gap:10px;margin-top:12px}.nextm .pill{background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:5px 11px;border-radius:999px;font-size:13px;font-weight:600;margin-right:auto}
.nextm .ci{font-size:14px;font-weight:600;opacity:.9}.nextm .dvb{background:rgba(255,255,255,.2);color:#fff}.nextm .dvb.si.on{background:#34c759}.nextm .dvb.no.on{background:#ff3b30}
.trn{display:flex;align-items:center;gap:12px;margin-top:10px;cursor:pointer}.trn .k,.lastm .k{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}.trn b{display:block;font-size:18px;font-weight:700;margin-top:2px}
.lastm{margin-top:10px;cursor:pointer}.lastm .vs .tm span{color:var(--text)}.lastm .score{font-size:40px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}.lastm .score i{font-style:normal;color:var(--muted);margin:0 6px;font-weight:600}.lastm .hr{color:var(--muted);opacity:1;font-size:13px}
.lastm .scr{font-size:14px;color:var(--muted);text-align:center;margin-top:4px}.lastm .more{color:var(--tint);font-weight:600;font-size:14px;margin-top:10px}
.mvprow{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:14px;background:color-mix(in srgb,#ffcc00 16%,transparent)}.mvprow .av{width:40px;height:40px;font-size:14px}.mvprow .st{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b8860b}.mvprow b{font-size:16px}
.greet{margin:16px 2px 12px}.hero.home{margin-top:6px}.greet b{display:block;font-size:20px;font-weight:700;letter-spacing:-.01em}.greet span{display:block;color:var(--muted);font-size:16px;margin-top:2px}
.pres{padding:10px 16px 12px;cursor:pointer;border-top:.5px solid var(--sep,rgba(60,60,67,.18))}.lbl+.pres{border-top:0}.pres:active{background:var(--fill)}
.pnum{display:flex;gap:14px;margin-top:6px;font-size:14px;color:var(--muted)}.pnum b{font-size:17px;color:var(--text);margin-right:2px}.pnum .g b{color:var(--green)}.pnum .r b{color:var(--red)}
.pnames{margin:6px 0 0;font-size:14px;line-height:1.4}.pdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:7px;vertical-align:1px;opacity:.6}.pdot.g{background:var(--green);opacity:1}.pdot.r{background:var(--red);opacity:1}
.dvg{display:flex;gap:8px;flex:none}
.dvb{width:44px;height:44px;border-radius:50%;border:0;background:var(--fill);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:transform .12s ease,background .2s ease,color .2s ease;-webkit-tap-highlight-color:transparent}
.dvb:active,.dvp:active{transform:scale(.92)}
.dvb.si.on{background:var(--green);color:#fff}.dvb.no.on{background:var(--red);color:#fff}
.dvp{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 14px;border-radius:999px;border:0;background:var(--fill);color:var(--text);font:inherit;font-size:16px;font-weight:600;cursor:pointer;transition:transform .12s ease,background .2s ease,color .2s ease}
.dvp.si svg{color:var(--green)}.dvp.no svg{color:var(--red)}
.dvp.si.on{background:var(--green);color:#fff}.dvp.no.on{background:var(--red);color:#fff}.dvp.on svg{color:#fff}
.bench{display:flex;gap:10px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.bench::-webkit-scrollbar{display:none}
.bp{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;flex:none;cursor:pointer;border:0;background:none;padding:0}
.bp .av{width:46px;height:46px;font-size:15px}
.bp span{font-size:12px;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.bp:active .av{transform:scale(.92)}
.pk{font:inherit;color:inherit}.pk+.pk::before{content:"";position:absolute;top:0;right:0;left:72px;border-top:.5px solid var(--line)}
.tlogo{object-fit:contain;flex:none;display:inline-grid;place-items:center;border-radius:50%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.18))}
.tlogo.ph{background:var(--fill);color:var(--muted);font-weight:700;filter:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center;margin-top:14px}
.vs .tm{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.2}
.vs .mid{font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;min-width:90px}
.vs .mid small{display:block;font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.mvp{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(110deg,color-mix(in srgb,#ffcc00 22%,var(--card)),var(--card));box-shadow:var(--shadow);margin-top:10px;cursor:pointer}
.mvp .st{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#b8860b}
@media (prefers-color-scheme:dark){.mvp .st{color:#ffd60a}}
.bp .av{transition:box-shadow .15s}.bp.on .av{box-shadow:0 0 0 3px #ffcc00,0 6px 14px rgba(255,204,0,.35)}.mvp .av{width:48px;height:48px;box-shadow:0 0 0 2.5px #ffcc00}
.mvp .rs{font-size:13px;color:var(--muted)}
.news{position:relative;border-radius:16px;padding:14px 16px 14px 52px;background:var(--card);box-shadow:var(--shadow);margin-bottom:10px}
.news::before{content:"📣";position:absolute;left:16px;top:13px;font-size:22px}
.news.urg{background:color-mix(in srgb,var(--red) 12%,var(--card));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--red) 45%,transparent)}
.news.urg::before{content:"⚠️"}
.news .t{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.news.urg .t{color:var(--red)}
.news p{margin:3px 0 0;white-space:pre-wrap;font-size:17px;line-height:1.35}
.news .x{position:absolute;right:8px;top:8px;border:0;background:var(--fill);width:30px;height:30px;border-radius:50%;cursor:pointer;color:var(--muted)}
.conv{border-radius:18px;padding:16px 18px;margin-bottom:12px;color:#fff;background:linear-gradient(120deg,#1a7f37,#0b5d2a);box-shadow:0 12px 30px -14px rgba(26,127,55,.8);cursor:pointer;line-height:1.45}
.conv .t{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;opacity:.9;margin-bottom:4px}.conv b{font-size:20px;display:block;margin-bottom:4px}
.mebtn{border:0;background:none;padding:0;cursor:pointer}.mebtn .av{width:36px;height:36px;font-size:13px}
#login{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto}#login.on{display:block}
#pub{position:fixed;inset:0;z-index:61;background:var(--bg);display:none;overflow:auto}#pub.on{display:block}
#pub .lg{max-width:640px;margin:0 auto;padding:calc(28px + var(--safe-t)) 16px 48px}
#pub h2{font-size:20px;margin:26px 6px 10px}
.fcbrand{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;letter-spacing:-.03em;font-size:17px;color:var(--text,inherit)}.fcbrand b{color:#157A3A;font-weight:800}
.pubrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:.5px solid var(--line)}.pubrow:first-child{border-top:0}.pubrow .sc{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#login .lg{max-width:420px;margin:0 auto;padding:calc(60px + var(--safe-t)) 22px 40px}
.hint{font-size:14px;color:var(--muted);text-align:center;margin:8px 0 0;min-height:20px}

/* spazio per il badge "Powered by Netlify" (piano gratuito) */
body.nf nav.bar{bottom:58px;border-radius:22px;left:10px;right:10px;border:.5px solid var(--line);box-shadow:0 8px 24px rgba(0,0,0,.12)}
body.nf .wrap{padding-bottom:calc(170px + var(--safe-b))}
body.nf .toast{top:calc(10px + var(--safe-t))}
/* ================= RESTYLING v2 · Oneglia ================= */
html.v2{
  --og:#1d7a3e; --og2:#15602f; --navy:#0c1f45; --navy2:#16305f;
  --bg:#f4f6f9; --bg2:#f4f6f9; --card:#ffffff; --card2:#eef1f5; --fill:#eef1f5; --fill2:#e3e8ef;
  --line:#e6eaf0; --text:#0c1f45; --muted:#6b7689;
  --tint:var(--og); --green:#1d7a3e; --red:#d93a32; --amber:#d98a12; --blue:#2453a6;
  --bar:rgba(255,255,255,.86); --sheet:#f4f6f9;
  --r:18px; --r-sm:12px;
  --shadow:0 1px 2px rgba(12,31,69,.04),0 8px 24px -14px rgba(12,31,69,.18);
  --shadow-up:0 2px 4px rgba(12,31,69,.05),0 16px 32px -16px rgba(12,31,69,.28);
  --ease:cubic-bezier(.22,.8,.24,1);
}
@media (prefers-color-scheme:dark){html.v2{
  --bg:#08132b; --bg2:#08132b; --card:#0f1d3a; --card2:#16274a; --fill:#16274a; --fill2:#1d315a;
  --line:rgba(255,255,255,.08); --text:#eef2f8; --muted:#8e9ab0; --og:#3fb46a; --green:#3fb46a; --red:#ff5a50; --amber:#f0a432; --blue:#6b9bff;
  --bar:rgba(12,24,50,.86); --sheet:#0b1733; --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 26px -16px rgba(0,0,0,.6); --shadow-up:var(--shadow);
}}
html.v2 body{font-size:16px;letter-spacing:-.005em;font-feature-settings:"tnum" 0}
/* titoli più contenuti */
html.v2 .ltitle{font-size:28px;letter-spacing:-.02em;font-weight:800}
html.v2 .lsub{font-size:14px;margin-bottom:12px}
html.v2 h2{font-size:22px;letter-spacing:-.015em}
html.v2 h3{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--muted);margin:24px 4px 8px}
html.v2 .greet b{font-size:17px}html.v2 .greet span{font-size:15px}
html.v2 .top img{width:28px}
/* schede: un solo sistema di bordi, raggi e ombre */
html.v2 .card,html.v2 .list,html.v2 .hero,html.v2 .mecard,html.v2 .mvpc,html.v2 .news,html.v2 .nextm,html.v2 .sponsor,html.v2 .stat3 div,html.v2 .banner{border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line)}
html.v2 .nextm{border:0;box-shadow:var(--shadow-up)}
html.v2 .card+.card{margin-top:12px}
html.v2 .hero,html.v2 .mecard,html.v2 .mvpc,html.v2 .nextm,html.v2 .trn,html.v2 .lastm{margin-top:12px}
html.v2 .mecard{margin-top:0}
/* righe elenco */
html.v2 .li{min-height:62px;padding:11px 16px;gap:13px}
html.v2 .li+.li::before{left:74px;border-top:1px solid var(--line)}
html.v2 .li .nm b{font-weight:600;font-size:16px}
html.v2 .li .nm span{font-size:13px}
html.v2 .li:active{background:var(--fill)}
/* avatar e schede giocatore: toni sobri per ruolo */
html.v2 .av{font-weight:700;letter-spacing:.03em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
html.v2 .av.POR{background:linear-gradient(160deg,#d9a23e,#b07a17)}
html.v2 .av.DIF{background:linear-gradient(160deg,#2f56a0,#16305f)}
html.v2 .av.CEN{background:linear-gradient(160deg,#2f9152,#17602f)}
html.v2 .av.ATT{background:linear-gradient(160deg,#c4534a,#8d2a24)}
html.v2 .av.STF{background:linear-gradient(160deg,#7d879a,#566176)}
html.v2 .av .n{background:var(--navy);color:#fff;box-shadow:0 0 0 2px var(--card);font-size:10.5px;padding:1px 5px;font-variant-numeric:tabular-nums}
@media (prefers-color-scheme:dark){html.v2 .av .n{background:#fff;color:var(--navy)}}
html.v2 .mecard{padding:16px;gap:14px;background:linear-gradient(180deg,var(--card),var(--card))}
html.v2 .mecard .av{width:58px;height:58px;font-size:19px;box-shadow:0 0 0 3px var(--card),0 0 0 5px color-mix(in srgb,var(--og) 35%,transparent)}
html.v2 .mecard b{font-size:18px}
html.v2 .mst{gap:0;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
html.v2 .mst span{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;font-size:11.5px;font-weight:500;white-space:nowrap}
html.v2 .mst span+span{border-left:1px solid var(--line);padding-left:10px;margin-left:10px}
html.v2 .conv,html.v2 .news{margin:12px 0 0}html.v2 .view>.btn.sm{margin-top:12px}
html.v2 .mst b{display:block!important;font-size:19px!important;font-weight:800;letter-spacing:-.02em;text-transform:none;color:var(--text);font-variant-numeric:tabular-nums}
/* classifica (hero) */
html.v2 .hero{padding:18px;gap:16px;position:relative;overflow:hidden}
html.v2 .hero img{width:62px}
html.v2 .hero .big{font-size:32px;font-weight:800;letter-spacing:-.025em}
html.v2 .hero .lbl{font-size:11.5px;letter-spacing:.07em;font-weight:700}
html.v2 .hero .row{gap:0;margin-top:12px}
html.v2 .hero .row div{padding-right:16px}
html.v2 .hero .row div+div{padding-left:16px;border-left:1px solid var(--line)}
html.v2 .hero .row div b{font-size:20px;font-weight:800}
html.v2 .hero .row div span{font-size:12px}
/* statistiche */
html.v2 .stat3{gap:10px}
html.v2 .stat3 div{padding:14px 12px;text-align:left}
html.v2 .stat3 b{font-size:24px;font-weight:800;color:var(--text)}
html.v2 .stat3 span{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
html.v2 .pct{font-weight:800}
html.v2 .bar2{height:6px;background:var(--fill2)}html.v2 .bar2 i{background:linear-gradient(90deg,var(--og),#38a960)}
html.v2 table.cl{font-size:14px}
html.v2 table.cl th{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
html.v2 table.cl td{border-top:1px solid var(--line);padding:10px 4px}
html.v2 table.cl tr.me td{background:color-mix(in srgb,var(--og) 10%,transparent);color:var(--og);font-weight:700}
html.v2 table.cl tr.me td.tm span{color:var(--text)}
/* stemmi: stesse proporzioni ovunque */
html.v2 .tlogo{object-fit:contain;border-radius:0;filter:drop-shadow(0 2px 4px rgba(12,31,69,.18));aspect-ratio:1/1}
html.v2 .tlogo.ph{border-radius:50%;background:var(--fill2);filter:none}
html.v2 .vs .tm .tlogo{width:60px!important;height:60px!important}
html.v2 .vs .tm span{font-size:13px;font-weight:700}
/* partite */
html.v2 .nextm{padding:18px 16px 16px;border-radius:22px}
html.v2 .nextm::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.22));pointer-events:none}
html.v2 .nextm>*{position:relative}
html.v2 .nextm .lab{font-size:11.5px;letter-spacing:.08em}
html.v2 .vs .when{font-size:19px}
html.v2 .nextm .meta{gap:4px;font-size:13.5px;border-top:1px solid rgba(255,255,255,.16);padding-top:10px;margin-top:10px}
html.v2 .lastm .score{font-size:36px}
html.v2 .lastm .scr{font-size:13px}
html.v2 .vs .mid{font-size:36px;font-weight:800}
html.v2 .score{font-size:40px;font-weight:800}
html.v2 .tag{font-size:12px;font-weight:700;padding:3px 9px;letter-spacing:.01em}
html.v2 .mvpc{background:linear-gradient(115deg,color-mix(in srgb,#e8b520 18%,var(--card)) 0%,var(--card) 70%);border-color:color-mix(in srgb,#e8b520 35%,var(--line))}
html.v2 .mvpc .av{box-shadow:0 0 0 3px var(--card),0 0 0 5px #e8b520}
html.v2 .mvpc b{font-size:18px}
html.v2 .conv{border-radius:var(--r);background:linear-gradient(125deg,var(--og),var(--og2) 60%,#0f4a24);box-shadow:var(--shadow-up)}
html.v2 .news{padding:14px 16px 14px 50px}
html.v2 .news p{font-size:16px}
/* pulsanti e segmenti */
html.v2 .btn{font-size:16px;font-weight:700}
html.v2 .btn.p{background:var(--og);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--og) 80%,transparent)}
html.v2 .btn.sm{font-size:14px;padding:8px 15px}
html.v2 .seg{border-radius:12px;padding:3px;background:var(--fill2)}
html.v2 .seg button{border-radius:9px;font-size:13.5px;padding:7px 6px;transition:background .25s var(--ease),box-shadow .25s var(--ease),color .2s}
html.v2 .seg button.on{background:var(--card);color:var(--text);box-shadow:0 2px 8px -2px rgba(12,31,69,.18)}
html.v2 .chip{font-size:14px;font-weight:600;padding:7px 14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
html.v2 .chip.on{background:var(--navy);color:#fff;box-shadow:none}
@media (prefers-color-scheme:dark){html.v2 .chip.on{background:#fff;color:var(--navy)}}
html.v2 .search{background-color:var(--card);box-shadow:inset 0 0 0 1px var(--line);border-radius:14px;padding-top:11px;padding-bottom:11px;font-size:16px}
html.v2 .f input,html.v2 .f select,html.v2 .f textarea{border-radius:var(--r-sm);box-shadow:inset 0 0 0 1px var(--line);font-size:16px}
html.v2 .f label{font-size:11.5px;font-weight:700;letter-spacing:.06em}
html.v2 .sheet{border-radius:22px 22px 0 0}
html.v2 .addb{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
/* menu inferiore compatto e fluttuante */
html.v2 nav.bar{left:12px;right:12px;bottom:calc(10px + var(--safe-b));padding:6px;border-radius:24px;border:1px solid var(--line);box-shadow:0 12px 30px -12px rgba(12,31,69,.3);max-width:440px;margin:0 auto;gap:4px}
html.v2 nav.bar a{gap:3px;padding:6px 0 5px;border-radius:18px;font-size:10.5px;font-weight:600;color:var(--muted);transition:color .2s,background .25s var(--ease)}
html.v2 nav.bar a svg{width:22px;height:22px;transition:transform .25s var(--ease)}
html.v2 nav.bar a.on{color:var(--og);background:color-mix(in srgb,var(--og) 11%,transparent)}
html.v2 nav.bar a.on svg{transform:translateY(-1px)}
html.v2 nav.bar a:active svg{transform:scale(.9)}
html.v2 .wrap{padding-bottom:calc(110px + var(--safe-b))}
html.v2 body.nf nav.bar{bottom:62px}

const GG=["dom","lun","mar","mer","gio","ven","sab"], MM=["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
function fmtD(iso,long){if(!iso)return"—";const [y,m,d]=iso.split("-").map(Number);const dt=new Date(y,m-1,d);return (long?GG[dt.getDay()]+" ":"")+d+" "+MM[m-1]+(long?"":" "+y)}
function daysTo(iso){if(!iso)return null;const [y,m,d]=iso.split("-").map(Number);const a=new Date(y,m-1,d),b=new Date();b.setHours(0,0,0,0);return Math.round((a-b)/864e5)}
function rel(iso){const n=daysTo(iso);if(n===null)return"";if(n===0)return"oggi";if(n===1)return"domani";if(n===-1)return"ieri";return n>0?"tra "+n+" giorni":n*-1+" giorni fa"}

const tkey=n=>String(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
function logoFor(name){const k=tkey(name);if(!k)return"";if(k.includes("oneglia"))return CREST;const map={...LOGHI,...((S.info.loghi&&S.info.loghi.mappa)||{})};
  let v=map[k];if(!v){const hit=Object.keys(map).find(x=>x.includes(k)||k.includes(x));v=hit&&map[hit]}return typeof v==="string"&&v.startsWith("data:image/")?v:""}
function badge(name,size=36){const l=logoFor(name);return l?`<img class="tlogo" src="${l}" alt="" style="width:${size}px;height:${size}px">`:`<span class="tlogo ph" style="width:${size}px;height:${size}px;font-size:${Math.round(size*.36)}px">${esc(String(name||"?").replace(/[^A-Za-z ]/g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase())}</span>`}
const isPlayed=m=>m.golFatti!=null&&m.golFatti!=="";
const lastPlayed=()=>S.matches.filter(m=>isPlayed(m)&&daysTo(m.data)<=0).sort((a,b)=>b.data.localeCompare(a.data))[0];

// ---------- stats
function playerStats(pid){
  let tot=0,pres=0;
  for(const t of S.trainings){const v=t.presenze&&t.presenze[pid];if(v){tot++;if(v==="P")pres++}}
  let conv=0,gol=0,ass=0,gia=0,ros=0,min=0,mvp=0,vs=0,vn=0;
  for(const m of S.matches){if((m.convocati||[]).includes(pid))conv++;gol+=Number((m.marcatori||{})[pid]||0);ass+=Number((m.assist||{})[pid]||0);gia+=Number((m.gialli||{})[pid]||0);ros+=Number((m.rossi||{})[pid]||0);min+=Number((m.minuti||{})[pid]||0);if(m.mvp===pid)mvp++;const vv=Number((m.voti||{})[pid]);if(vv){vs+=vv;vn++}}
  return {tot,pres,pct:tot?Math.round(pres/tot*100):null,conv,gol,ass,gia,ros,min,mvp,media:vn?Math.round(vs/vn*100)/100:null,nvoti:vn};
}
const sortedPlayers=()=>[...S.players].sort((a,b)=>fullName(a).localeCompare(fullName(b),"it"));
const upcoming=(arr)=>arr.filter(x=>x.data&&daysTo(x.data)>=0).sort((a,b)=>(a.data+(a.ora||"")).localeCompare(b.data+(b.ora||"")));
const past=(arr)=>arr.filter(x=>x.data&&daysTo(x.data)<0).sort((a,b)=>(b.data+(b.ora||"")).localeCompare(a.data+(a.ora||"")));

const LIVE_PROV={
  espn:{async giorno(lega,day){const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/${lega}/scoreboard?dates=${day.replace(/-/g,"")}&_=${Date.now()}`);if(!r.ok)throw 0;const j=await r.json();const out={};
    (j.events||[]).forEach(e=>{const st=(e.status||{}).type||{};const cp=((e.competitions||[])[0]||{}).competitors||[];const h=cp.find(x=>x.homeAway==="home")||{},a=cp.find(x=>x.homeAway==="away")||{};
      out[e.id]={st:st.state,fin:!!st.completed,min:(e.status||{}).displayClock||"",det:st.shortDetail||"",gc:h.score,go:a.score}});return out}}};

function liveFinestra(day){PUB.live=PUB.live||{};PUB.liveTs=PUB.liveTs||{};const C=PUB.camp||[];const now=new Date(),hm=now.getHours()*60+now.getMinutes();const out={};
  C.forEach(c=>{const l=c.dati&&c.dati.lega;if(!l||!FONTI[fonteDi(c)].live)return;[...(c.dati.programma||[])].forEach(m=>{if(m.data!==day||!m.eid)return;const x=PUB.live[m.eid];if(x&&x.st==="post")return;

      for(let i=0;i<d.length;i+=4){if(d[i+3]<200)continue;const r=d[i],g=d[i+1],b=d[i+2],mx=Math.max(r,g,b),mn=Math.min(r,g,b);if(mx-mn<45||mx<50)continue;let h;if(mx===r)h=((g-b)/(mx-mn))%6;else if(mx===g)h=(b-r)/(mx-mn)+2;else h=(r-g)/(mx-mn)+4;h=Math.round(((h*60+360)%360)/24);(bins[h]=bins[h]||{n:0,r:0,g:0,b:0});const B=bins[h];B.n++;B.r+=r;B.g+=g;B.b+=b}

function girDay(m,g,i,idx){

  let rs=(G.risultati||[]).filter(r=>g?r.giornata===g:near(r.data)),played=true;
  if(!rs.length){rs=(G.programma||[]).filter(r=>g?r.giornata===g:near(r.data));played=false}

  if(!rs.length)return `<div class="gday" data-gd="${i}" ${i===idx?"":"hidden"}></div>`;
  const GL=(S.info.girlive&&S.info.girlive.items)||{};
  const w=(a,b)=>a!=null&&+a>+b?" w":"";
  const rowH=r=>{const gl=!played?GL[glKey(r.giornata,r.casa,r.ospite)]:null;const sc=played?r:gl;const tap=!played&&S.canWrite;

function tidyBtns(root){
  if(!root)return;
  root.querySelectorAll(".row.wrap2").forEach(r=>{const k=[...r.children];if(k.length&&k.every(c=>c.classList.contains("btn"))){r.className="btns";r.removeAttribute("style")}});
  const isB=e=>e&&((e.classList.contains("btn")&&!e.classList.contains("d")&&!e.closest(BTN_SKIP)&&!e.closest(".btns")&&e.parentElement&&!e.parentElement.classList.contains("row"))||e.classList.contains("btns"));
  [...root.querySelectorAll(".btn,.btns")].forEach(b=>{
    if(!b.isConnected||!isB(b)||(b.classList.contains("btns")&&b.dataset.t))return;
    if(b.previousElementSibling&&isB(b.previousElementSibling))return;
    const run=[];let e=b;while(e&&isB(e)){run.push(e);e=e.nextElementSibling}
    const g=document.createElement("div");g.className="btns";g.dataset.t="1";b.before(g);
    run.forEach(x=>{if(x.classList.contains("btns")){[...x.children].forEach(c=>g.appendChild(c));x.remove()}else g.appendChild(x)});

  root.querySelectorAll(".btns").forEach(g=>{const sec=[...g.children].filter(c=>!c.classList.contains("p")&&!c.classList.contains("d"));

}

(function(){const sh=$("#sheet");let y0=null,dy=0,hist=[];
  sh.addEventListener("pointerdown",e=>{if(!e.target.closest(".grab")&&!(sh.scrollTop<=0&&e.target.closest("h2,.grab")))return;y0=e.clientY;dy=0;hist=[[e.clientY,e.timeStamp]];sh.classList.add("drag");sh.setPointerCapture(e.pointerId)});
  sh.addEventListener("pointermove",e=>{if(y0===null)return;dy=e.clientY-y0;const d=dy<0?-(Math.abs(dy)*40)/(40+Math.abs(dy)):dy;sh.style.transform=`translate(-50%,${d}px)`;hist.push([e.clientY,e.timeStamp]);if(hist.length>5)hist.shift()});
  const end=()=>{if(y0===null)return;sh.classList.remove("drag");const a=hist[0],b=hist[hist.length-1];const v=b&&a&&b[1]>a[1]?(b[0]-a[0])/(b[1]-a[1])*1000:0;const proj=dy+(v/1000)*.998/(1-.998);sh.style.transform="";y0=null;if(proj>sh.offsetHeight*.5)closeSheet()};
  sh.addEventListener("pointerup",end);sh.addEventListener("pointercancel",end);
})();
function askDelete(label,fn){
  const box=document.createElement("div");box.className="card";box.style.marginTop="14px";
  box.innerHTML=`<b>Eliminare ${esc(label)}?</b><p class="muted small" style="margin:6px 0 12px">L'operazione non si può annullare.</p><div class="row"><button class="btn sm" id="dNo">Annulla</button><button class="btn sm d" id="dYes">Elimina</button></div>`;
  $("#sheet").appendChild(box);box.scrollIntoView({behavior:"smooth"});
  box.querySelector("#dNo").onclick=()=>box.remove();
  box.querySelector("#dYes").onclick=async()=>{if(await fn()){closeSheet();toast("Eliminato")}};
}
function field(id,label,val,type="text",opts){
  if(type==="select")return `<div class="f"><label for="${id}">${label}</label><select id="${id}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(val??"")===String(v)?"selected":""}>${esc(l)}</option>`}).join("")}</select></div>`;
  if(type==="textarea")return `<div class="f"><label for="${id}">${label}</label><textarea id="${id}">${esc(val)}</textarea></div>`;
  return `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${type==="tel"?'inputmode="tel"':""}></div>`;
}

function weekSheet(){
  const days=[[1,"Lun"],[2,"Mar"],[3,"Mer"],[4,"Gio"],[5,"Ven"]];
  const sel=new Set([2,4]);
  const draw=()=>`<h2>Settimana tipo</h2><p class="muted small">Crea in un colpo gli allenamenti delle prossime settimane.</p>
   <div class="f"><label>Giorni</label><div class="chips">${days.map(([d,l])=>`<button class="chip ${sel.has(d)?"on":""}" data-d="${d}">${l}</button>`).join("")}</div></div>
   <div class="f2">${field("wOra","Ora","18:30","time")}${field("wSet","Per quante settimane","4","number")}</div>${field("wLuo","Campo",(S.info.impostazioni&&S.info.impostazioni.campo)||"")}
   <div class="actions"><button class="btn" onclick="closeSheet()">Annulla</button><button class="btn p" id="sv">Crea</button></div>`;
  const bind=()=>{document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const d=+b.dataset.d;sel.has(d)?sel.delete(d):sel.add(d);b.classList.toggle("on")});
    $("#sv").onclick=async()=>{const w=Math.min(12,Math.max(1,+val("wSet")||1));const ora=val("wOra"),luogo=val("wLuo");if(!sel.size){toast("Scegli almeno un giorno");return}
      $("#sv").disabled=true;let c=0;const start=new Date();start.setHours(0,0,0,0);
      for(let i=0;i<w*7;i++){const d=new Date(start);d.setDate(d.getDate()+i);if(!sel.has(d.getDay()))continue;
        const iso=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
        if(S.trainings.some(t=>t.data===iso))continue;
        if(await save("trainings",uid(),{data:iso,ora,luogo,tipo:"Allenamento",note:"",presenze:{}}))c++;}
      closeSheet();toast(c+" allenamenti creati")}};
  openSheet(draw());bind();
}

// ---------- formazione
const MODULI=["4-4-2","4-3-3","4-2-3-1","3-5-2","3-4-3","4-5-1","5-3-2"];
function slotsFor(mod){
  const rows=mod.split("-").map(Number);const out=[{x:50,y:90,r:"POR"}];
  const yTop=17,yBot=72;
  rows.forEach((n,ri)=>{const y=rows.length===1?50:yBot-(yBot-yTop)*ri/(rows.length-1);
    const role=ri===0?"DIF":ri===rows.length-1?"ATT":"CEN";
    const span=n>=5?84:n===4?76:n===3?60:n===2?40:0;
    for(let i=0;i<n;i++){const x=n===1?50:50-span/2+span*i/(n-1);out.push({x,y,r:role})}});
  return out;
}
const PITCH_SVG=`<svg class="lines" viewBox="0 0 68 96" preserveAspectRatio="none" fill="none" stroke="rgba(255,255,255,.55)" stroke-width=".35"><rect x="2" y="2" width="64" height="92" rx="1"/><line x1="2" y1="48" x2="66" y2="48"/><circle cx="34" cy="48" r="8"/><circle cx="34" cy="48" r=".6" fill="rgba(255,255,255,.6)"/><rect x="14" y="2" width="40" height="15"/><rect x="24" y="2" width="20" height="5.5"/><rect x="14" y="79" width="40" height="15"/><rect x="24" y="88.5" width="20" height="5.5"/><path d="M27 17a8 8 0 0 0 14 0M27 79a8 8 0 0 1 14 0"/></svg>`;
function pitchHTML(f,opts={}){
  const sl=slotsFor(f.modulo||"4-4-2");
  return `<div class="pitch ${opts.mini?"mini":""}" ${opts.id?`id="${opts.id}"`:""}>${PITCH_SVG}${sl.map((p,i)=>{const pid=(f.slots||[])[i];const pl=pid&&S.players.find(x=>x.id===pid);
    return pl?`<div class="pl ${opts.sel===i?"sel":""}" data-i="${i}" style="left:${p.x}%;top:${p.y}%">${avatar(pl)}${f.cap===pid?`<span class="capm">C</span>`:""}<span class="lb">${esc(pl.cognome||pl.nome)}</span></div>`
    :`<div class="pl empty ${opts.sel===i?"sel":""}" data-i="${i}" style="left:${p.x}%;top:${p.y}%"><div class="av">${opts.mini?"":"+"}</div>${opts.mini?"":`<span class="lb">${({POR:"Portiere",DIF:"Difesa",CEN:"Centro",ATT:"Attacco"})[p.r]}</span>`}</div>`}).join("")}</div>`;
}
function autoFill(f,pool){
  const sl=slotsFor(f.modulo);const used=new Set();const out=new Array(11).fill(null);
  const rank=p=>{const st=playerStats(p.id);return (p.stato&&p.stato!=="ok"?-1000:0)+(st.pct??50)+st.gol*5};
  const avail=pool.filter(isAvailable).sort((a,b)=>rank(b)-rank(a));
  sl.forEach((s,i)=>{const p=avail.find(x=>!used.has(x.id)&&x.ruolo===s.r);if(p){out[i]=p.id;used.add(p.id)}});
  sl.forEach((s,i)=>{if(out[i])return;const p=avail.find(x=>!used.has(x.id)&&x.ruolo!=="POR");if(p){out[i]=p.id;used.add(p.id)}});
  return out;
}
function formText(m,f){
  const sl=slotsFor(f.modulo);const name=i=>{const p=S.players.find(x=>x.id===f.slots[i]);return p?fullName(p):"—"};
  const rows=f.modulo.split("-").map(Number);let k=1;const lines=[`🧤 ${name(0)}`];
  rows.forEach(n=>{const r=[];for(let j=0;j<n;j++)r.push(name(k++));lines.push(r.join(" · "))});
  const bench=sortedPlayers().filter(p=>(m.convocati||[]).includes(p.id)&&!f.slots.includes(p.id)).map(fullName);
  return `⚽ *FORMAZIONE ${TEAM.toUpperCase()}* (${f.modulo})\n${m.casa?TEAM+" – "+m.avversario:m.avversario+" – "+TEAM} · ${fmtD(m.data,1)}\n\n${lines.reverse().join("\n")}${bench.length?"\n\n🪑 Panchina: "+bench.join(", "):""}`;
}
function formationSheet(id){
  const m=S.matches.find(x=>x.id===id);if(!m)return;
  const base=S.info.formazioneBase&&(S.info.formazioneBase.slots||[]).some(Boolean)?S.info.formazioneBase:null;
  const hasOwn=m.formazione&&(m.formazione.slots||[]).some(Boolean);
  const fromBase=(src)=>{const out=[...(src.slots||[])].slice(0,11);let miss=0;for(let k=0;k<out.length;k++){const p=out[k]&&S.players.find(x=>x.id===out[k]);if(!p||!isAvailable(p)){if(out[k])miss++;out[k]=null}}return{slots:out,miss}};
  let f={modulo:(m.formazione&&m.formazione.modulo)||"4-4-2",slots:[...((m.formazione&&m.formazione.slots)||[])],cap:(m.formazione&&m.formazione.cap)||null};let usedBase=false;
  if(!hasOwn&&base){const r=fromBase(base);f={modulo:base.modulo||"4-4-2",slots:r.slots};usedBase=true;if(r.miss)setTimeout(()=>toast(r.miss===1?"1 titolare non disponibile":r.miss+" titolari non disponibili"),400)}
  while(f.slots.length<11)f.slots.push(null);
  let sel=null;

  const hint=()=>S.canWrite?"Tocca un posto per scegliere il giocatore · trascina per scambiare":"Solo lettura";
  const draw=()=>{
    const bench=pool().filter(p=>!f.slots.includes(p.id));

    return `<div class="row"><div class="sp"><h2>Formazione</h2><span class="muted small">${m.casa?"vs":"@"} ${esc(m.avversario)} · ${fmtD(m.data,1)}</span></div>${S.canWrite?`<button class="btn sm" id="auto">Proponi</button>`:""}</div>
    ${usedBase?`<div class="banner" style="margin-top:12px;background:color-mix(in srgb,var(--tint) 12%,var(--card))">Partita dalla <b>formazione base</b>: cambia solo chi serve e salva.</div>`:""}
    <div class="mods">${MODULI.map(x=>`<button class="chip ${x===f.modulo?"on":""}" data-mod="${x}">${x}</button>`).join("")}</div>
    ${pitchHTML(f,{id:"pe",sel})}
    <p class="hint">${hint()}</p>
    ${S.canWrite&&f.slots.some(Boolean)?`<h3>Capitano</h3><div class="chips">${f.slots.filter(Boolean).map(pid=>S.players.find(x=>x.id===pid)).filter(Boolean).map(p=>`<button class="chip ${f.cap===p.id?"on":""}" data-cap="${p.id}">${esc(p.cognome)}</button>`).join("")}</div>`:""}
    <h3 style="margin-top:14px">${(m.convocati||[]).length?"Panchina":"Rosa"} · ${bench.length}</h3>
    <div class="bench">${bench.map(p=>`<button class="bp" data-b="${p.id}">${avatar(p)}<span>${esc(p.cognome)}</span></button>`).join("")||`<span class="muted small" style="padding:10px">Tutti in campo</span>`}</div>
    ${S.canWrite?`<h3>Formazione base</h3><div class="card"><p class="small" style="margin:0 0 12px">La formazione di partenza per tutte le partite. Ogni nuova partita parte da qui, poi il mister cambia 1, 2 o 3 giocatori.</p><div class="row wrap2"><button class="btn sm p" id="bSave">⭐ Salva questa come base</button>${base?`<button class="btn sm" id="bLoad">↺ Carica la base</button>`:""}</div>${base?`<p class="muted small" style="margin:10px 0 0">Base attuale: ${esc(base.modulo)} · ${(base.slots||[]).filter(Boolean).length} giocatori</p>`:""}</div>`:""}
    <button class="btn p" id="img" style="width:100%;margin-top:14px">Foto della formazione per WhatsApp</button>
    <div class="row wrap2" style="margin-top:10px"><button class="btn sm" id="cp">Copia testo</button><a class="btn sm" style="text-decoration:none" id="wa" href="#">Testo su WhatsApp</a></div>${S.canWrite?`<button class="btn" id="prn" style="width:100%;margin-top:10px">Stampa per spogliatoio</button>`:""}
    <div class="actions" style="position:sticky;bottom:0;background:var(--sheet);padding:10px 0"><button class="btn" onclick="openMatch('${id}')">Indietro</button>${S.canWrite?`<button class="btn p" id="sv">Salva</button>`:""}</div>`};
  const re=()=>{const y=$("#sheet").scrollTop;$("#sheet").innerHTML=`<div class="grab"></div>`+draw();bind();$("#sheet").scrollTop=y};
  const tapSlot=i=>{if(!S.canWrite){toast("Solo lo staff può modificare");return}sel=i;re();openPicker(i)};
  const closePicker=()=>{const p=$("#picker");p.classList.remove("on");$("#pscrim").classList.remove("on");sel=null;setTimeout(re,10)};
  const openPicker=i=>{
    const sl=slotsFor(f.modulo)[i];const cur=f.slots[i]&&S.players.find(p=>p.id===f.slots[i]);
    const roleName=sl.r==="POR"?"Portiere":ROLE[sl.r].s;
    const conv=new Set(m.convocati||[]);
    const RN={POR:"Portieri",DIF:"Difensori",CEN:"Centrocampisti",ATT:"Attaccanti"};const ord={POR:0,DIF:1,CEN:2,ATT:3};
    const free=sortedPlayers().filter(p=>!f.slots.includes(p.id));
    const byConv=(a,b)=>(conv.has(b.id)-conv.has(a.id));
    const bench=free.filter(p=>p.ruolo===sl.r).sort(byConv);

  };
  const bind=()=>{
    document.querySelectorAll("[data-mod]").forEach(b=>b.onclick=()=>{if(!S.canWrite)return;f.modulo=b.dataset.mod;sel=null;re()});
    document.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{if(!S.canWrite)return;let i=sel;if(i===null){const want=b.dataset.b&&S.players.find(p=>p.id===b.dataset.b);const sl=slotsFor(f.modulo);i=sl.findIndex((s,k)=>!f.slots[k]&&want&&s.r===want.ruolo);if(i<0)i=f.slots.findIndex(x=>!x);if(i<0){toast("Campo pieno: tocca il giocatore da sostituire");return}}f.slots[i]=b.dataset.b;sel=null;haptic();re()});

async function distintaPDF(m,d){
  toast("Preparo la distinta…");
  let J;try{J=(await loadJsPDF()).jsPDF}catch(e){toast("Serve internet per creare il PDF");return}

  const {tit,ris,hasF}=distRows(m);
  const L=12,R=198,Wd=R-L;
  const fit=(t,w)=>{t=String(t||"");while(t&&doc.getTextWidth(t)>w)t=t.slice(0,-1);return t};
  try{const im=await loadImg(CREST);if(im){const c=document.createElement("canvas");c.width=im.width;c.height=im.height;c.getContext("2d").drawImage(im,0,0);doc.addImage(c.toDataURL("image/png"),"PNG",L,8,15,15*im.height/im.width)}}catch(e){}

  let y=40;doc.setDrawColor(180);doc.setLineWidth(.3);doc.rect(L,y-5,Wd,info.length*6+3);
  info.forEach(([k,v])=>{doc.setFont("helvetica","bold");doc.text(k+":",L+3,y);doc.setFont("helvetica","normal");doc.text(fit(v,Wd-40),L+35,y);y+=6});
  y+=6;
  const cols=[["N.",8],["Maglia",14],["Cognome e nome",56],["Data di nascita",26],["N° tessera",28],["Documento",44],["C/VC",10]];
  const RH=5.8,dnas=v=>{const [Y,M,D]=String(v||"").split("-");return D?D+"/"+M+"/"+Y:""};
  const head=()=>{doc.setFillColor(235,235,235);doc.rect(L,y,Wd,RH,"F");doc.setFont("helvetica","bold");doc.setFontSize(9);let x=L;cols.forEach(([t,w])=>{doc.text(t,x+1.5,y+4.1);x+=w});y+=RH};
  const line=(vals,bold)=>{if(y>270){doc.addPage();y=15;head()}doc.setFont("helvetica",bold?"bold":"normal");doc.setFontSize(9.5);let x=L;doc.rect(L,y,Wd,RH);cols.forEach(([t,w],i)=>{if(i)doc.line(x,y,x,y+RH);doc.text(fit(vals[i],w-3),x+1.5,y+4.1);x+=w});y+=RH};
  const sec=t=>{doc.setFont("helvetica","bold");doc.setFontSize(8.5);doc.setFillColor(245,245,245);doc.rect(L,y,Wd,5,"FD");doc.text(t,L+2,y+3.6);y+=5};
  head();let n=0;
  const pl=p=>line([String(++n),distNum(d,p),fullName(p),dnas(p.nascita),p.tessera||"",p.documento||"",d.cap===p.id?"C":d.vice===p.id?"VC":""]);
  if(hasF){sec("TITOLARI");tit.forEach(pl);sec("RISERVE")}
  ris.forEach(pl);
  for(let i=n;i<(hasF?20:18);i++)line([String(++n),"","","","","",""]);
  y+=7;if(y>240){doc.addPage();y=15}
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Dirigenti e tecnici",L,y);y+=3;
  const st=(d.staffDist||[]).map(id=>S.staff.find(x=>x.id===id)).filter(Boolean);
  const sc=[["Qualifica",42],["Cognome e nome",62],["N° tessera",36],["Documento",46]];y+=1;
  doc.setFillColor(235,235,235);doc.rect(L,y,Wd,RH,"F");doc.setFontSize(9);let x=L;sc.forEach(([t,w])=>{doc.text(t,x+1.5,y+4.1);x+=w});y+=RH;
  const sr=v=>{if(y>275){doc.addPage();y=15}doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.rect(L,y,Wd,RH);let x=L;sc.forEach(([t,w],i)=>{if(i)doc.line(x,y,x,y+RH);doc.text(fit(v[i],w-3),x+1.5,y+4.1);x+=w});y+=RH};
  st.forEach(s=>sr([s.ruolo||"",fullName(s),s.tessera||"",s.documento||""]));
  for(let i=st.length;i<Math.max(4,st.length+1);i++)sr(["","","",""]);
  y+=12;if(y>282){doc.addPage();y=25}
  doc.setFont("helvetica","normal");doc.setFontSize(9.5);doc.line(R-80,y,R,y);doc.text("Firma del dirigente accompagnatore ufficiale",R-40,y+5,{align:"center"});
  const blob=doc.output("blob"),name="distinta-"+tkey(m.avversario).slice(0,20)+"-"+(m.data||"")+".pdf";
  let dl=null;try{dl=window.claude&&claude.use?await claude.use("downloads"):null}catch(e){}if(!dl)dl=webSaver();
  if(dl){try{await dl.save({filename:name,data:blob});toast("Distinta pronta");return}catch(e){if(e&&e.code==="declined")return}}
  const u=URL.createObjectURL(blob);const w=window.open(u,"_blank");if(!w)location.href=u;
}

let _disc=null;
function discipline(){
  if(_disc)return _disc;
  const R=S.info.regole||{};const th=Math.max(2,+R.sqGialli||4);
  const order=S.matches.filter(m=>m.data).sort((a,b)=>(a.data+(a.ora||"")).localeCompare(b.data+(b.ora||"")));
  const played=order.filter(isPlayed);
  const nm=order.find(m=>!isPlayed(m)&&daysTo(m.data)>=0);
  const res={};
  for(const p of S.players){
    let y=0;const susp=[];
    for(const m of played){const g=+((m.gialli||{})[p.id]||0),r=(m.rossi||{})[p.id];
      if(r){susp.push({after:m,n:Math.max(1,+((m.squalGiornate||{})[p.id])||1),motivo:g>=2?"doppia ammonizione":"espulsione"});if(g===1&&false)y++}
      else if(g){y++;if(y%th===0)susp.push({after:m,n:1,motivo:th+"ª ammonizione"})}}
    let sq=null;for(const s of susp){const i=order.indexOf(s.after);const serve=order.slice(i+1,i+1+s.n);if(nm&&serve.includes(nm))sq=s.motivo}
    res[p.id]={gialli:y,th,squalificato:sq,diffidato:!sq&&y%th===th-1};
  }
  return _disc=res;
}

function cassaSummary(){let saldo=0,daInc=0;const deb={};
  for(const c of S.cassa){const v=+c.importo||0;if(c.tipo==="uscita")saldo-=v;else if(c.tipo==="entrata")saldo+=v;else{if(c.pagato)saldo+=v;else{daInc+=v;if(c.pid)deb[c.pid]=(deb[c.pid]||0)+v}}}

function vCassa(){

// ================= CALENDARIO (Google Calendar) =================
function gcal(title,date,time,mins,loc,details){
  if(!date)return"";const d=date.replace(/-/g,"");let dates;
  if(time){const [h,mi]=time.split(":").map(Number);const s=new Date(2000,0,1,h,mi);const e=new Date(s.getTime()+mins*60000);const f=x=>String(x.getHours()).padStart(2,"0")+String(x.getMinutes()).padStart(2,"0")+"00";dates=d+"T"+f(s)+"/"+d+"T"+f(e)}
  else{const n=new Date(date);n.setDate(n.getDate()+1);dates=d+"/"+n.toISOString().slice(0,10).replace(/-/g,"")}
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(title)+"&dates="+dates+"&ctz=Europe/Rome"+(loc?"&location="+encodeURIComponent(loc):"")+(details?"&details="+encodeURIComponent(details):"");
}

function birthdays(){const t=new Date();t.setHours(0,0,0,0);const out=[];
  for(const p of S.players){if(!p.nascita)continue;const [y,m,d]=p.nascita.split("-").map(Number);let b=new Date(t.getFullYear(),m-1,d);if(b<t)b=new Date(t.getFullYear()+1,m-1,d);const n=Math.round((b-t)/864e5);if(n<=7)out.push({p,n,eta:b.getFullYear()-y})}
  return out.sort((a,b)=>a.n-b.n)}
function milestones(){
  const lp=lastPlayed();if(!lp||daysTo(lp.data)<-8)return[];const out=[];
  const before=S.matches.filter(m=>isPlayed(m)&&m.id!==lp.id&&m.data<=lp.data);
  const sum=(arr,k,pid)=>arr.reduce((a,m)=>a+Number((m[k]||{})[pid]||0),0);
  const pres=(arr,pid)=>arr.filter(m=>(m.formazione&&(m.formazione.slots||[]).includes(pid))||Number((m.minuti||{})[pid])>0).length;
  const cross=(a,b,steps)=>steps.find(s=>a<s&&b>=s);
  for(const p of S.players){const all=[...before,lp];
    const g=cross(sum(before,"marcatori",p.id),sum(all,"marcatori",p.id),[1,5,10,15,20,25,30,40,50]);if(g)out.push({p,t:g===1?"primo gol stagionale ⚽":g+"° gol stagionale ⚽"});
    const a=cross(sum(before,"assist",p.id),sum(all,"assist",p.id),[5,10,15,20]);if(a)out.push({p,t:a+" assist 🅰️"});
    const pr=cross(pres(before,p.id),pres(all,p.id),[10,20,25,50,75,100]);if(pr)out.push({p,t:pr+" presenze 👕"});
    const mv=cross(before.filter(m=>m.mvp===p.id).length,all.filter(m=>m.mvp===p.id).length,[3,5,10]);if(mv)out.push({p,t:mv+" volte migliore in campo ⭐"});
  }
  return out;
}

async function renderResult(m){
  const W=1080,H=1350,cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
  const FONT='-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif';const ft=(w,s)=>c.font=`${w} ${s}px ${FONT}`;
  const gf=+m.golFatti||0,gs=+m.golSubiti||0,win=gf>gs,draw=gf==gs;
  const acc=win?"#34e07a":draw?"#ffd60a":"#ff6b5e";
  // sfondo: blu notte profondo con luce dall'alto
  let g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,"#071334");g.addColorStop(.55,"#0a1a44");g.addColorStop(1,"#050c22");c.fillStyle=g;c.fillRect(0,0,W,H);
  const glow=(x,y,r,col,a)=>{const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col.replace("A",a));rg.addColorStop(1,col.replace("A",0));c.fillStyle=rg;c.fillRect(0,0,W,H)};
  glow(W/2,-120,900,"rgba(70,130,255,A)",.45);
  glow(W/2,H+200,800,win?"rgba(40,200,110,A)":draw?"rgba(255,200,0,A)":"rgba(255,80,70,A)",.28);

async function logoPrep(f){const img=new Image();img.src=URL.createObjectURL(f);await img.decode().catch(()=>{});const W=Math.min(600,img.width),H=Math.round(img.height*W/img.width);const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d",{willReadFrequently:true});x.drawImage(img,0,0,W,H);

function webSaver(){return{save:async({filename,data})=>{
  const ext=filename.split(".").pop();const type={png:"image/png",pdf:"application/pdf",jpg:"image/jpeg"}[ext]||"application/octet-stream";
  const file=new File([data],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:filename});return{status:"saved"}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"};}}
